# Gate the editor tools behind a password (form + cookie login; see
# netlify/edge-functions/editor-auth.js). The rest of the site stays public.
# Build command and publish directory remain as configured in the Netlify dashboard.
#
# Optional env var REPLICATE_API_TOKEN (alias: TEXT_TO_IMAGE): a Replicate API
# token enabling the Studio's AI image generation (Insert → Image → Generate,
# flux-1.1-pro) via netlify/functions/generate-image.mjs. The token is only
# ever read server-side — never commit it to the repo.
# Optional OPENVERSE_CLIENT_ID / OPENVERSE_CLIENT_SECRET: free Openverse API
# credentials (https://api.openverse.org/v1/#tag/auth) for the Insert → Image
# photo search — without them Openverse's anonymous rate limits apply and
# some deployments are rejected outright.

# The copy editor now lives inside the Presentation Studio (its "Copy editor"
# overlay; #copy opens straight onto the live-deck editor). Redirect the old
# URLs so bookmarks keep working — the Studio itself is gated below.
[[redirects]]
  from = "/copy-editor.html"
  to = "/presentation-studio.html#copy"
  status = 301

[[redirects]]
  from = "/copy-editor"
  to = "/presentation-studio.html#copy"
  status = 301

# The Presentation Studio is an authoring tool — gate it behind the password.
[[edge_functions]]
  path = "/presentation-studio.html"
  function = "editor-auth"

[[edge_functions]]
  path = "/presentation-studio"
  function = "editor-auth"

# The NorthStar 2.0 viewer and the two overview pages it embeds — gated the
# same way. The sign-in cookie is site-wide, so unlocking the viewer also
# unlocks the embedded frames.
[[edge_functions]]
  path = "/northstar-2.html"
  function = "editor-auth"

[[edge_functions]]
  path = "/northstar-2"
  function = "editor-auth"

[[edge_functions]]
  path = "/ns2.0-detailed.html"
  function = "editor-auth"

[[edge_functions]]
  path = "/ns2.0-detailed"
  function = "editor-auth"

[[edge_functions]]
  path = "/ns2.0-basic.html"
  function = "editor-auth"

[[edge_functions]]
  path = "/ns2.0-basic"
  function = "editor-auth"

# The NorthStar roadmap — gated the same way.
[[edge_functions]]
  path = "/roadmap.html"
  function = "editor-auth"

[[edge_functions]]
  path = "/roadmap"
  function = "editor-auth"

# The Slide Converter now lives inside the Presentation Studio (Decks →
# Import… accepts .pptx directly). Redirect the old URLs so bookmarks keep
# working — the Studio itself is gated above.
[[redirects]]
  from = "/slide-converter.html"
  to = "/presentation-studio.html"
  status = 301

[[redirects]]
  from = "/slide-converter"
  to = "/presentation-studio.html"
  status = 301

# The Digital Arena developer portal mockup — gated the same way.
[[edge_functions]]
  path = "/developer-portal.html"
  function = "editor-auth"

[[edge_functions]]
  path = "/developer-portal"
  function = "editor-auth"
