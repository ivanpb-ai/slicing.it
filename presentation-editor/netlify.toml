# Presentation Studio — Netlify configuration.
#
# Environment variables (Site settings → Environment variables):
#   EDITOR_USERS        optional — per-user accounts as comma-separated
#                       "username:password" pairs (e.g. "alice:pw1,bob:pw2").
#                       Each user signs in with their own credentials and
#                       sees/edits only their own presentations.
#   EDITOR_PASSWORD     optional — a single shared password instead (one
#                       shared deck library). Ignored when EDITOR_USERS is set.
#                       Neither set: the editor is public, decks device-local.
#   PERPLEXITY_API_KEY  optional — enables AI-enriched "interactive pages"
#                       export (netlify/functions/perplexity.mjs).
#   PERPLEXITY_MODEL    optional — defaults to "sonar".

[build]
  command = "npm run build"
  publish = "dist"

# Gate the editor behind the password (no-op while EDITOR_PASSWORD is unset).
[[edge_functions]]
  path = "/"
  function = "editor-auth"

[[edge_functions]]
  path = "/index.html"
  function = "editor-auth"
